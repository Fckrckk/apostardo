name: APOSTARDO - Datos multideporte (TheSportsDB)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: write

concurrency:
  group: apostardo-multifuente
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recolectar datos deportivos públicos
        run: python .github/workflows/sync-multifuente.py

      - name: Guardar datos validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then
            echo 'No hubo cambios.'
          else
            git commit -m 'Actualizar feeds multideporte TheSportsDB'
            git pull --rebase
            git push
          fi
